<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex, nofollow">
	<title>Rekap Presensi | SMK NUSANTARA 1 KOTA TANGERANG</title>
	<style>
		:root {
			--navy: #14243b;
			--blue: #2f6fed;
			--ink: #172235;
			--muted: #708096;
			--line: #dce5f0;
			--white: #ffffff;
			--green: #18875b;
		}

		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; padding: 24px 20px 52px; color: var(--ink); font-family: "Trebuchet MS", "Segoe UI", sans-serif; background: linear-gradient(135deg, #f3f7fc 0%, #e9f0f9 48%, #dbe8f7 100%); }
		.page { width: min(100%, 1100px); margin: auto; }
		.topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 26px; }
		.brand { display: flex; align-items: center; gap: 12px; color: var(--navy); font-size: 13px; font-weight: 800; letter-spacing: .04em; }
		.brand img { width: 38px; height: 38px; object-fit: contain; }
		.actions { display: flex; flex-wrap: wrap; gap: 9px; }
		button, .back-link { display: inline-flex; align-items: center; justify-content: center; padding: 10px 14px; border: 0; border-radius: 8px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 800; text-decoration: none; }
		.primary { color: var(--white); background: var(--blue); }
		.primary:hover { background: #245bc9; }
		.secondary, .back-link { color: var(--navy); background: #edf2f8; }
		.secondary:hover, .back-link:hover { background: #dfe8f3; }
		.panel { padding: 28px; background: var(--white); border: 1px solid rgba(255, 255, 255, .8); border-radius: 16px; box-shadow: 0 18px 46px rgba(35, 62, 101, .12); }
		h1 { margin: 0 0 6px; color: var(--navy); font-family: Georgia, serif; font-size: 36px; font-weight: 500; }
		.intro { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
		.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin: 24px 0; }
		.metric { padding: 16px 0; border-top: 2px solid var(--line); }
		.metric strong { display: block; color: var(--navy); font-size: 28px; line-height: 1.15; }
		.metric span { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
		.toolbar { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
		.search-field { display: grid; flex: 1; min-width: min(100%, 260px); gap: 6px; }
		label { color: var(--navy); font-size: 12px; font-weight: 800; }
		input { width: 100%; padding: 11px 12px; color: var(--ink); background: #fbfdff; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
		input:focus { outline: 3px solid #d5e3ff; border-color: var(--blue); }
		.results-count { margin: 0; color: var(--muted); font-size: 12px; }
		.table-wrap { overflow-x: auto; }
		table { width: 100%; border-collapse: collapse; font-size: 13px; }
		th, td { padding: 11px 9px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
		th { color: var(--muted); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
		th:last-child, td:last-child { position: sticky; right: 0; background: var(--white); box-shadow: -6px 0 8px rgba(20, 36, 59, .06); }
		th:last-child { z-index: 1; }
		.photo { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; vertical-align: middle; }
		.status { color: var(--green); font-weight: 800; }
		.delete-button { padding: 7px 10px; color: #b33a3a; background: var(--white); border: 1px solid #edcaca; font-size: 11px; }
		.delete-button:hover { background: #fff3f3; }
		.confirm-modal[hidden] { display: none; }
		.confirm-modal { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(20, 36, 59, .48); }
		.confirm-dialog { width: min(100%, 380px); padding: 26px; background: var(--white); border-radius: 16px; box-shadow: 0 20px 50px rgba(20, 36, 59, .24); animation: rise .2s ease both; }
		.confirm-dialog h2 { margin: 0 0 8px; font-size: 22px; }
		.confirm-dialog p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
		.confirm-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
		.confirm-button { padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 800; }
		.cancel-button { color: var(--navy); background: #edf2f8; }
		.confirm-delete-button { color: var(--white); background: #b33a3a; }
		.confirm-delete-button:hover { background: #972f2f; }
		.empty { margin: 20px 0 0; color: var(--muted); font-size: 13px; }
		main[hidden] { display: none; }
		@media (max-width: 600px) { body { padding: 18px 12px 36px; } .topbar { align-items: flex-start; flex-direction: column; } .panel { padding: 21px 17px; } h1 { font-size: 31px; } .summary { gap: 12px; } }
	</style>
</head>
<body>
	<main class="page" id="recap-page" hidden>
		<header class="topbar">
			<div class="brand">
				<img src="logo nusteng.png" alt="Logo NUSTENG">
				<span>SMK NUSANTARA 1 KOTA TANGERANG</span>
			</div>
			<nav class="actions" aria-label="Navigasi admin">
				<a class="back-link" href="index.html">Kembali ke Absensi</a>
				<button class="secondary" id="logout-button" type="button">Keluar Admin</button>
			</nav>
		</header>
		<section class="panel" aria-labelledby="page-title">
			<h1 id="page-title">Rekap Presensi</h1>
			<p class="intro">Daftar seluruh presensi yang tersimpan di browser ini.</p>
			<div class="summary" aria-live="polite">
				<div class="metric"><strong id="total-attendances">0</strong><span>Total presensi</span></div>
				<div class="metric"><strong id="unique-students">0</strong><span>Siswa tercatat</span></div>
			</div>
			<div class="toolbar">
				<div class="search-field">
					<label for="search-input">Cari nama, NIS, atau nomor kartu</label>
					<input id="search-input" type="search" autocomplete="off">
				</div>
				<button class="primary" id="export-button" type="button">Unduh CSV</button>
			</div>
			<p class="results-count" id="results-count" aria-live="polite"></p>
			<div class="table-wrap">
				<table>
					<thead>
						<tr><th>Foto</th><th>Nama</th><th>NIS</th><th>Nomor Kartu</th><th>Kelas</th><th>Jurusan</th><th>Status</th><th>Tanggal</th><th>Waktu</th><th>Aksi</th></tr>
					</thead>
					<tbody id="attendance-list"></tbody>
				</table>
				<p class="empty" id="empty-message" hidden>Belum ada presensi yang tercatat.</p>
			</div>
		</section>
	</main>
	<div class="confirm-modal" id="confirm-modal" role="presentation" hidden>
		<section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-description">
			<h2 id="confirm-title">Yakin ingin hapus?</h2>
			<p id="confirm-description"></p>
			<div class="confirm-actions">
				<button class="confirm-button cancel-button" id="cancel-delete" type="button">Batal</button>
				<button class="confirm-button confirm-delete-button" id="confirm-delete" type="button">Hapus</button>
			</div>
		</section>
	</div>
	<script>
		const sessionKey = "adminRecapLoggedIn";
		const historyKey = "riwayatPresensi";
		const recapPage = document.getElementById("recap-page");
		if (sessionStorage.getItem(sessionKey) !== "true") {
			window.location.replace("login-rekap.html");
		} else {
			recapPage.hidden = false;
		}

		const attendanceList = document.getElementById("attendance-list");
		const emptyMessage = document.getElementById("empty-message");
		const searchInput = document.getElementById("search-input");
		const resultsCount = document.getElementById("results-count");
		const confirmModal = document.getElementById("confirm-modal");
		const confirmDescription = document.getElementById("confirm-description");
		const cancelDeleteButton = document.getElementById("cancel-delete");
		const confirmDeleteButton = document.getElementById("confirm-delete");
		let attendanceRecords = [];
		let recordIndexToDelete = null;

		function readAttendanceRecords() {
			try {
				const records = JSON.parse(localStorage.getItem(historyKey));
				return Array.isArray(records) ? records : [];
			} catch (error) {
				return [];
			}
		}

		function readStudentMajors() {
			try {
				const students = JSON.parse(localStorage.getItem("dataSiswa"));
				return new Map((Array.isArray(students) ? students : []).map((student) => [student.nis, student.major]));
			} catch (error) {
				return new Map();
			}
		}

		function renderAttendance() {
			const query = searchInput.value.trim().toLocaleLowerCase("id-ID");
			const studentMajors = readStudentMajors();
			const filteredRecords = attendanceRecords
				.map((record, index) => ({ ...record, index }))
				.filter((record) => [record.name, record.nis, record.cardNumber, record.className, record.major || studentMajors.get(record.nis)]
					.some((value) => String(value || "").toLocaleLowerCase("id-ID").includes(query)))
				.reverse();
			const studentIds = new Set(attendanceRecords.map((record) => record.nis));
			document.getElementById("total-attendances").textContent = attendanceRecords.length;
			document.getElementById("unique-students").textContent = studentIds.size;
			resultsCount.textContent = `${filteredRecords.length} dari ${attendanceRecords.length} presensi ditampilkan`;
			emptyMessage.hidden = filteredRecords.length > 0;
			attendanceList.replaceChildren();

			filteredRecords.forEach((record) => {
				const row = document.createElement("tr");
				const photoCell = document.createElement("td");
				const photo = document.createElement("img");
				photo.className = "photo";
				photo.src = record.photo || "FOTO SISWA/esokkoloh.jpg";
				photo.alt = `Foto siswa ${record.name || ""}`;
				photoCell.appendChild(photo);
				row.appendChild(photoCell);
				const values = [record.name, record.nis, record.cardNumber || "-", record.className, record.major || studentMajors.get(record.nis) || "-", record.status || "Hadir", record.date, record.time];
				values.forEach((value, index) => {
					const cell = document.createElement("td");
					cell.textContent = value || "-";
					if (index === 4) cell.className = "status";
					row.appendChild(cell);
				});
				const actionCell = document.createElement("td");
				const deleteButton = document.createElement("button");
				deleteButton.type = "button";
				deleteButton.className = "delete-button";
				deleteButton.dataset.recordIndex = record.index;
				deleteButton.textContent = "Hapus";
				deleteButton.setAttribute("aria-label", `Hapus presensi ${record.name || "siswa"} pada ${record.date || "tanggal tidak diketahui"}`);
				actionCell.appendChild(deleteButton);
				row.appendChild(actionCell);
				attendanceList.appendChild(row);
			});
		}

		function closeDeleteModal() {
			confirmModal.hidden = true;
			recordIndexToDelete = null;
		}

		searchInput.addEventListener("input", renderAttendance);
		attendanceList.addEventListener("click", (event) => {
			const deleteButton = event.target.closest(".delete-button");
			if (!deleteButton) return;

			const recordIndex = Number(deleteButton.dataset.recordIndex);
			const record = attendanceRecords[recordIndex];
			if (!record) return;

			recordIndexToDelete = recordIndex;
			confirmDescription.textContent = `Presensi ${record.name} pada ${record.date} akan dihapus.`;
			confirmModal.hidden = false;
			confirmDeleteButton.focus();
		});

		cancelDeleteButton.addEventListener("click", closeDeleteModal);
		confirmModal.addEventListener("click", (event) => {
			if (event.target === confirmModal) closeDeleteModal();
		});
		document.addEventListener("keydown", (event) => {
			if (event.key === "Escape" && !confirmModal.hidden) closeDeleteModal();
		});
		confirmDeleteButton.addEventListener("click", () => {
			if (recordIndexToDelete === null) return;
			const updatedRecords = readAttendanceRecords();
			if (recordIndexToDelete < 0 || recordIndexToDelete >= updatedRecords.length) {
				closeDeleteModal();
				return;
			}
			updatedRecords.splice(recordIndexToDelete, 1);
			try {
				localStorage.setItem(historyKey, JSON.stringify(updatedRecords));
				attendanceRecords = updatedRecords;
				renderAttendance();
			} catch (error) {
				window.alert("Riwayat presensi gagal dihapus.");
			}
			closeDeleteModal();
		});
		document.getElementById("export-button").addEventListener("click", () => {
			const query = searchInput.value.trim().toLocaleLowerCase("id-ID");
			const studentMajors = readStudentMajors();
			const recordsToExport = attendanceRecords.filter((record) => [record.name, record.nis, record.cardNumber, record.className, record.major || studentMajors.get(record.nis)]
				.some((value) => String(value || "").toLocaleLowerCase("id-ID").includes(query)));
			const headers = ["Nama", "NIS", "Nomor Kartu", "Kelas", "Jurusan", "Status", "Tanggal", "Waktu"];
			const csvValue = (value) => `"${String(value || "").replace(/"/g, '""')}"`;
			const csv = [headers, ...recordsToExport.map((record) => [record.name, record.nis, record.cardNumber, record.className, record.major || studentMajors.get(record.nis), record.status || "Hadir", record.date, record.time])]
				.map((row) => row.map(csvValue).join(","))
				.join("\r\n");
			const downloadUrl = URL.createObjectURL(new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" }));
			const downloadLink = document.createElement("a");
			downloadLink.href = downloadUrl;
			downloadLink.download = "rekap-presensi.csv";
			downloadLink.click();
			URL.revokeObjectURL(downloadUrl);
		});
		document.getElementById("logout-button").addEventListener("click", () => {
			sessionStorage.removeItem(sessionKey);
			sessionStorage.removeItem("adminLoggedIn");
			window.location.replace("login-admin.html");
		});

		attendanceRecords = readAttendanceRecords();
		renderAttendance();
	</script>
</body>
</html>
