<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tambah Data Siswa | SMK NUSANTARA 1 KOTA TANGERANG</title>
	<style>
		:root {
			--navy: #14243b;
			--blue: #2f6fed;
			--ink: #172235;
			--muted: #708096;
			--line: #dce5f0;
			--white: #ffffff;
			--sky: #eaf2ff;
			--green: #18875b;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			padding: 28px 20px 60px;
			color: var(--ink);
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
			background: linear-gradient(135deg, #f3f7fc 0%, #e9f0f9 48%, #dbe8f7 100%);
		}

		.page { width: min(100%, 760px); margin: auto; }
		.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; color: var(--navy); font-weight: 800; letter-spacing: .04em; }
		.brand img { width: 38px; height: 38px; object-fit: contain; }
		.panel { padding: 34px; background: var(--white); border-radius: 18px; box-shadow: 0 20px 50px rgba(35, 62, 101, .14); }
		h1 { margin: 0 0 8px; color: var(--navy); font-family: Georgia, serif; font-size: 38px; font-weight: 500; }
		.intro { margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.6; }
		form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
		.field { display: grid; gap: 6px; }
		.field.full { grid-column: 1 / -1; }
		label { color: var(--navy); font-size: 12px; font-weight: 800; }
		input { width: 100%; padding: 12px; color: var(--ink); background: #fbfdff; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
		input:focus { outline: 3px solid #d5e3ff; border-color: var(--blue); }
		.actions { display: flex; align-items: center; gap: 12px; grid-column: 1 / -1; margin-top: 4px; }
		button, .back-link { display: inline-block; padding: 12px 18px; border: 0; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 800; text-decoration: none; }
		button { color: var(--white); background: var(--blue); }
		button:hover { background: #245bc9; }
		.back-link { color: var(--navy); background: #edf2f8; }
		.message { min-height: 18px; margin: 0; color: var(--green); font-size: 12px; font-weight: 700; }
		.message.error { color: #b33a3a; }
		.student-management { margin-top: 22px; }
		.student-management h2 { margin: 0 0 6px; color: var(--navy); font-size: 23px; }
		.student-list { display: grid; gap: 9px; margin: 18px 0 0; padding: 0; list-style: none; }
		.student-list li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--sky); border-radius: 8px; }
		.student-list-info { display: grid; flex: 1; gap: 3px; min-width: 0; }
		.student-list-info strong { overflow-wrap: anywhere; }
		.student-list-info small { color: var(--muted); }
		.student-list-actions { display: flex; flex-wrap: wrap; gap: 7px; }
		.edit-button, .delete-button { padding: 8px 12px; font-size: 12px; }
		.delete-button { color: #b33a3a; background: var(--white); border: 1px solid #edcaca; }
		.delete-button:hover { background: #fff3f3; }
		.cancel-button { color: var(--navy); background: #edf2f8; }
		.cancel-button:hover { background: #dfe8f3; }
		.empty-list { margin: 18px 0 0; color: var(--muted); font-size: 13px; }

		@media (max-width: 600px) {
			body { padding: 20px 12px 36px; }
			.panel { padding: 25px 20px; }
			h1 { font-size: 32px; }
			form { grid-template-columns: 1fr; }
			.field.full, .actions { grid-column: auto; }
			.actions { flex-wrap: wrap; }
		}
	</style>
</head>
<body>
	<main class="page">
		<div class="brand">
			<img src="logo nusteng.png" alt="Logo NUSTENG">
			<span>SMK NUSANTARA 1 KOTA TANGERANG</span>
		</div>

		<section class="panel" aria-labelledby="page-title">
			<h1 id="page-title">Tambah Data Siswa</h1>
			<p class="intro">Data akan disimpan di browser ini dan langsung tersedia pada halaman absensi.</p>
			<form id="student-form">
				<div class="field">
					<label for="name">Nama siswa</label>
					<input id="name" name="name" required>
				</div>
				<div class="field">
					<label for="nis">NIS / ID siswa</label>
					<input id="nis" name="nis" inputmode="numeric" required>
				</div>
				<div class="field">
					<label for="className">Kelas</label>
					<input id="className" name="className" required>
				</div>
				<div class="field">
					<label for="major">Jurusan</label>
					<input id="major" name="major" required>
				</div>
				<div class="field full">
					<label for="photo">Upload foto siswa (opsional)</label>
					<input id="photo" name="photo" type="file" accept="image/*">
				</div>
				<div class="actions">
					<button id="submit-button" type="submit">Simpan Data Siswa</button>
					<button id="cancel-edit" class="cancel-button" type="button" hidden>Batal Edit</button>
					<a class="back-link" href="index.html">Kembali ke Absensi</a>
					<p class="message" id="message" role="status"></p>
				</div>
			</form>
		</section>

		<section class="panel student-management" aria-labelledby="student-list-title">
			<h2 id="student-list-title">Edit Profil / Data Siswa</h2>
			<p class="intro">Pilih tombol Edit untuk mengubah data siswa yang sudah tersimpan.</p>
			<ul class="student-list" id="student-list"></ul>
			<p class="empty-list" id="empty-list">Belum ada data siswa.</p>
		</section>
	</main>

	<script>
		const studentsStorageKey = "dataSiswa";
		const attendanceHistoryStorageKey = "riwayatPresensi";
		const studentForm = document.getElementById("student-form");
		const photoInput = document.getElementById("photo");
		const message = document.getElementById("message");
		const pageTitle = document.getElementById("page-title");
		const submitButton = document.getElementById("submit-button");
		const cancelEditButton = document.getElementById("cancel-edit");
		const studentList = document.getElementById("student-list");
		const emptyList = document.getElementById("empty-list");
		let editingIndex = null;

		function getStudents() {
			try {
				const students = JSON.parse(localStorage.getItem(studentsStorageKey));
				return Array.isArray(students) ? students : [];
			} catch (error) {
				return [];
			}
		}

		function readPhoto(file) {
			return new Promise((resolve, reject) => {
				if (!file) {
					resolve("");
					return;
				}

				const reader = new FileReader();
				reader.addEventListener("load", () => resolve(reader.result));
				reader.addEventListener("error", reject);
				reader.readAsDataURL(file);
			});
		}

		function saveStudents(students) {
			localStorage.setItem(studentsStorageKey, JSON.stringify(students));
		}

		function getAttendanceHistory() {
			try {
				const history = JSON.parse(localStorage.getItem(attendanceHistoryStorageKey));
				return Array.isArray(history) ? history : [];
			} catch (error) {
				return [];
			}
		}

		function updateAttendanceHistory(previousNis, student) {
			const history = getAttendanceHistory();
			const updatedHistory = history.map((record) => record.nis === previousNis ? {
				...record,
				name: student.name,
				nis: student.nis,
				className: student.className,
				major: student.major,
				photo: student.photo || record.photo
			} : record);
			localStorage.setItem(attendanceHistoryStorageKey, JSON.stringify(updatedHistory));
		}

		function showFormMessage(text, isError = false) {
			message.textContent = text;
			message.classList.toggle("error", isError);
		}

		function resetEditMode() {
			editingIndex = null;
			pageTitle.textContent = "Tambah Data Siswa";
			submitButton.textContent = "Simpan Data Siswa";
			cancelEditButton.hidden = true;
			studentForm.reset();
		}

		function startEditing(index) {
			const student = getStudents()[index];
			if (!student) return;

			editingIndex = index;
			pageTitle.textContent = "Edit Data Siswa";
			submitButton.textContent = "Simpan Perubahan";
			cancelEditButton.hidden = false;
			document.getElementById("name").value = student.name;
			document.getElementById("nis").value = student.nis;
			document.getElementById("className").value = student.className;
			document.getElementById("major").value = student.major;
			photoInput.value = "";
			showFormMessage(`Sedang mengedit data ${student.name}.`);
			window.scrollTo({ top: 0, behavior: "smooth" });
		}

		function renderStudents() {
			const students = getStudents();
			studentList.replaceChildren();
			emptyList.hidden = students.length > 0;

			students.forEach((student, index) => {
				const item = document.createElement("li");
				const info = document.createElement("div");
				const name = document.createElement("strong");
				const detail = document.createElement("small");
				const actions = document.createElement("div");
				const editButton = document.createElement("button");
				const deleteButton = document.createElement("button");
				info.className = "student-list-info";
				name.textContent = student.name;
				detail.textContent = `${student.nis} | ${student.className} | ${student.major}`;
				editButton.className = "edit-button";
				editButton.type = "button";
				editButton.textContent = "Edit";
				editButton.dataset.index = index;
				editButton.setAttribute("aria-label", `Edit data ${student.name}`);
				deleteButton.className = "delete-button";
				deleteButton.type = "button";
				deleteButton.textContent = "Hapus";
				deleteButton.dataset.index = index;
				deleteButton.setAttribute("aria-label", `Hapus data ${student.name}`);
				actions.className = "student-list-actions";
				actions.append(editButton, deleteButton);
				info.append(name, detail);
				item.append(info, actions);
				studentList.appendChild(item);
			});
		}

		studentList.addEventListener("click", (event) => {
			const editButton = event.target.closest(".edit-button");
			const deleteButton = event.target.closest(".delete-button");
			if (editButton) {
				startEditing(Number(editButton.dataset.index));
				return;
			}
			if (!deleteButton) return;

			const index = Number(deleteButton.dataset.index);
			const students = getStudents();
			const student = students[index];
			if (!student || !window.confirm(`Hapus data siswa ${student.name} beserta riwayat presensinya?`)) return;

			students.splice(index, 1);
			saveStudents(students);
			localStorage.setItem(
				attendanceHistoryStorageKey,
				JSON.stringify(getAttendanceHistory().filter((record) => record.nis !== student.nis))
			);
			if (editingIndex === index) {
				resetEditMode();
			} else if (editingIndex !== null && editingIndex > index) {
				editingIndex -= 1;
			}
			renderStudents();
			showFormMessage(`Data siswa ${student.name} berhasil dihapus.`);
		});

		cancelEditButton.addEventListener("click", () => {
			resetEditMode();
			showFormMessage("");
		});

		studentForm.addEventListener("submit", async (event) => {
			event.preventDefault();
			const formData = new FormData(studentForm);
			const photoFile = photoInput.files[0];
			const student = {
				name: formData.get("name").trim(),
				nis: formData.get("nis").trim(),
				className: formData.get("className").trim(),
				major: formData.get("major").trim()
			};
			const students = getStudents();

			if (students.some((savedStudent, index) => savedStudent.nis === student.nis && index !== editingIndex)) {
				showFormMessage("NIS / ID tersebut sudah terdaftar.", true);
				return;
			}

			try {
				const uploadedPhoto = await readPhoto(photoFile);
				if (uploadedPhoto) student.photo = uploadedPhoto;
				if (editingIndex === null) {
					saveStudents([...students, student]);
					showFormMessage("Data siswa berhasil disimpan. Silakan kembali ke halaman absensi.");
				} else {
					const previousStudent = students[editingIndex];
					const updatedStudents = [...students];
					updatedStudents[editingIndex] = { ...students[editingIndex], ...student };
					saveStudents(updatedStudents);
					updateAttendanceHistory(previousStudent.nis, updatedStudents[editingIndex]);
					showFormMessage("Perubahan data siswa berhasil disimpan.");
				}
				resetEditMode();
				renderStudents();
			} catch (error) {
				showFormMessage("Data gagal disimpan di browser ini.", true);
			}
		});

		renderStudents();
	</script>
</body>
</html>
